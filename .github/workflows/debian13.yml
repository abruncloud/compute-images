name: Build Debian 13
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build from Debian stable and security repositories
        run: |
          mkdir -p output
          docker run --rm --privileged \
            --mount "type=bind,src=$PWD/build.sh,dst=/build.sh,readonly" \
            --mount "type=bind,src=$PWD/output,dst=/output" \
            debian:13 bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring ca-certificates e2fsprogs systemd zstd
              /build.sh /output
            '
      - uses: actions/upload-artifact@v7
        with:
          name: debian13-${{ matrix.architecture }}
          path: output/
          compression-level: 0
          if-no-files-found: error
